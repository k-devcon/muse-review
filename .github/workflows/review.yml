name: Muse Code Review (reusable)

# 조직 공통 AI 코드 리뷰어. 각 레포는 이 워크플로를 `uses:` 로 호출하기만 합니다.
# 호출 예시는 README.md 참고.
#
# base 프롬프트가 별도 파일이 아니라 아래 heredoc 에 들어 있는 이유:
# 이 레포가 비공개라 호출 레포의 GITHUB_TOKEN 으로는 여기 파일을 읽을 수 없습니다.
# 반면 워크플로 yml 자체는 Actions 가 알아서 가져오므로, 프롬프트를 여기 두면
# 크로스레포 접근용 PAT 을 org 시크릿으로 만들지 않아도 됩니다.
# 덤으로 워크플로와 프롬프트가 같은 커밋/태그에 묶여 버전이 어긋날 수 없습니다.
on:
  workflow_call:
    inputs:
      model:
        description: Muse Code CLI 에 넘길 모델
        type: string
        default: muse-spark-1.3-contributor
      reasoning-effort:
        type: string
        default: medium
      max-model-steps:
        type: number
        default: 30
      focus-path:
        description: >-
          레포별 추가 리뷰 관점 파일 경로. 호출 레포의 기본 브랜치에서 읽어
          base 프롬프트의 __FOCUS__ 자리에 끼워 넣습니다. 없으면 그냥 건너뜁니다.
        type: string
        default: .github/muse-review-focus.md
      runs-on:
        type: string
        default: self-hosted
      timeout-minutes:
        type: number
        default: 20
    secrets:
      META_API_KEY:
        required: true

jobs:
  review:
    name: Muse Review
    # issue_comment 는 이슈에도 발생하므로 PR 코멘트인지 확인하고,
    # 쓰기 권한이 있는 사람의 `/review` 코멘트만 허용합니다.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ inputs.runs-on }}
    # 모델 단계가 멈췄을 때 self-hosted 러너를 무한 점유하지 않도록 상한을 둡니다.
    # 실측 리뷰 소요는 5~6분 수준입니다.
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: muse-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          head_sha=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0

      # base 프롬프트는 이 워크플로와 **같은 ref** 에서 가져옵니다.
      # 호출부가 `@v1` 로 핀을 고정하면 워크플로와 프롬프트가 항상 함께 움직입니다.
      - name: Resolve reusable workflow ref
        id: base
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # 예) k-devcon/muse-review/.github/workflows/review.yml@refs/tags/v1
          echo "repository=${WORKFLOW_REF%%/.github/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"
          echo "base prompt source: ${WORKFLOW_REF%%/.github/*}@${WORKFLOW_REF##*@}"

      # PR 체크아웃(워크스페이스 루트) **뒤에** 받아야 합니다.
      # 루트 체크아웃은 clean 시 워크스페이스를 비우므로 순서가 바뀌면 지워집니다.
      - name: Checkout base prompt
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.base.outputs.repository }}
          ref: ${{ steps.base.outputs.ref }}
          path: .muse-base
          fetch-depth: 1

      - name: Install Muse Code CLI
        run: |
          set -euo pipefail
          if ! command -v muse >/dev/null 2>&1; then
            curl -fsSL https://dev.meta.ai/install.sh | bash
            # 설치 위치(~/.local/bin)가 PATH 에 없을 수 있으므로 이후 스텝을 위해 등록
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          muse --version

      - name: Render review prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          FOCUS_PATH: ${{ inputs.focus-path }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/muse"
          mkdir -p "$work"

          # base 프롬프트는 위에서 체크아웃한 prompt/base.md 를 씁니다.
          # 워크스페이스를 깨끗이 두려고 RUNNER_TEMP 로 옮기고 체크아웃본은 지웁니다
          # (리뷰 대상 diff 에 .muse-base 가 섞여 보이지 않도록).
          base="$work/base.md"
          cp "$GITHUB_WORKSPACE/.muse-base/prompt/base.md" "$base"
          rm -rf "$GITHUB_WORKSPACE/.muse-base"
          [ -s "$base" ] || { echo "::error::base 프롬프트가 비어 있습니다."; exit 1; }

          # focus 파일은 호출 레포의 **기본 브랜치**에서만 가져옵니다.
          # 체크아웃은 PR head 이므로, PR 에서 focus 를 고쳐 리뷰어 동작을
          # 바꾸는 것을 막기 위함입니다. (도입 PR 에서는 아직 없으니 그냥 건너뜁니다.)
          focus="$work/focus.md"
          merged="$work/merged.md"
          if gh api "repos/$REPO/contents/$FOCUS_PATH?ref=$DEFAULT_BRANCH" \
               -H "Accept: application/vnd.github.raw" > "$focus" 2>/dev/null && [ -s "$focus" ]; then
            echo "focus: $DEFAULT_BRANCH:$FOCUS_PATH ($(wc -l < "$focus") 줄)"
            awk -v f="$focus" '/^__FOCUS__$/ { while ((getline line < f) > 0) print line; next } { print }' \
              "$work/base.md" > "$merged"
          else
            echo "::notice::$DEFAULT_BRANCH 에 $FOCUS_PATH 가 없어 base 프롬프트만 사용합니다."
            # 마커를 지우지 않고 빈 줄로 남긴다. 앞 목록과 "리뷰 방식:" 사이를
            # 띄우는 역할도 겸하는 자리라, 통째로 없애면 두 블록이 붙어버린다.
            sed 's/^__FOCUS__$//' "$work/base.md" > "$merged"
          fi

          sed -e "s|__REPO__|$REPO|g" \
              -e "s|__PR_NUMBER__|$PR_NUMBER|g" \
              -e "s|__HEAD_SHA__|$HEAD_SHA|g" \
              "$merged" > "$work/prompt.md"
          [ -s "$work/prompt.md" ] || { echo "::error::렌더링된 프롬프트가 비어 있습니다."; exit 1; }
          grep -q '__[A-Z_]\{3,\}__' "$work/prompt.md" \
            && { echo "::error::치환되지 않은 플레이스홀더가 남아 있습니다."; exit 1; } || true

      - name: Muse Code Review
        env:
          # 시크릿에는 Model API 대시보드에서 발급한 API 키가 들어 있습니다.
          # META_API_KEY: Muse Code CLI 가 읽는 변수. 저장된 로그인 세션보다 우선합니다.
          # MODEL_API_KEY: Model API / 공식 SDK 가 읽는 변수. 같은 키를 사용합니다.
          META_API_KEY: ${{ secrets.META_API_KEY }}
          MODEL_API_KEY: ${{ secrets.META_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          muse exec \
            --provider meta \
            --model "${{ inputs.model }}" \
            --reasoning-effort "${{ inputs.reasoning-effort }}" \
            --approval-mode never \
            --sandbox-network enabled \
            --max-model-steps "${{ inputs.max-model-steps }}" \
            --prompt-file "$RUNNER_TEMP/muse/prompt.md"
